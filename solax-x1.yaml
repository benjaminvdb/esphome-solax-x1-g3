# ESPHome configuration for SolaX X1 Boost, X1 Mini and X1 Air (generation 3)
# solar inverters, read over RS485 (Modbus RTU) with a Wemos D1 mini.
#
# Documentation, wiring diagram and troubleshooting:
#   https://github.com/benjaminvdb/solax-esphome
# Register addresses come from the official "SolaX Power X1-BOOST Single
# phase inverter Modbus-RTU comms protocol V1.0".

substitutions:
  name: solax
  # Put in front of every sensor name, e.g. "Solax Inverter Power".
  prefix: Solax
  # Wemos D1 mini pins. Change these if you wired it differently.
  tx_pin: D7
  rx_pin: D6
  flow_control_pin: D5
  # Set in the inverter menu; 1 is the default.
  modbus_address: "1"

esphome:
  name: ${name}
  # reuse_previous_range and OTA encryption need ESPHome 2026.9.0 or newer.
  min_version: 2026.9.0
  project:
    name: benjaminvdb.solax-esphome
    version: "1.0.0"

esp8266:
  board: d1_mini

api:
  encryption:
    key: !secret api_encryption_key

# Firmware updates over Wi-Fi, encrypted with the API key above.
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If the D1 mini can't reach your Wi-Fi, it opens its own network with this
  # name so you can enter new Wi-Fi details from your phone.
  ap:
    ssid: "${name}-fallback"
    password: !secret fallback_password

captive_portal:

debug:
  update_interval: 300s

button:
  - platform: restart
    name: "${prefix} Restart"
    entity_category: diagnostic
  - platform: safe_mode
    name: "${prefix} Restart (Safe Mode)"
    entity_category: diagnostic

# Logs are available over Wi-Fi; the USB serial port stays quiet.
logger:
  baud_rate: 0

uart:
  id: mod_bus
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 9600
  stop_bits: 1

# Timings from the SolaX protocol document: the inverter answers within 1 s
# and needs at least 1 s between two requests.
modbus:
  flow_control_pin: ${flow_control_pin}
  id: modbus1
  send_wait_time: 1000ms
  turnaround_time: 1000ms

modbus_controller:
  - id: solax
    address: ${modbus_address}
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 15s
    # The inverter switches off at night; then only check once a minute.
    offline_skip_updates: 3
    on_offline:
      - lambda: id(${prefix}_run_mode).publish_state("Offline");

sensor:
  - platform: modbus_controller
    modbus_controller_id: solax
    name: "${prefix} PV1 Input Voltage"
    address: 0x400
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    modbus_controller_id: solax
    name: "${prefix} PV2 Input Voltage"
    address: 0x401
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    modbus_controller_id: solax
    name: "${prefix} PV1 Input Current"
    address: 0x402
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    modbus_controller_id: solax
    name: "${prefix} PV2 Input Current"
    address: 0x403
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    modbus_controller_id: solax
    name: "${prefix} Grid Voltage"
    address: 0x404
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 0.1
  # `reuse_previous_range: true` sits on every register that follows a gap of
  # unused registers. It makes ESPHome read 0x400-0x428 in one request
  # instead of six, so all values come from the same moment.
  - platform: modbus_controller
    modbus_controller_id: solax
    name: "${prefix} Grid Frequency"
    address: 0x407
    register_type: read
    reuse_previous_range: true
    value_type: U_WORD
    accuracy_decimals: 2
    unit_of_measurement: Hz
    device_class: frequency
    state_class: measurement
    filters:
      - multiply: 0.01
  - platform: modbus_controller
    modbus_controller_id: solax
    name: "${prefix} Output Current"
    address: 0x40A
    register_type: read
    reuse_previous_range: true
    value_type: U_WORD
    accuracy_decimals: 1
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    modbus_controller_id: solax
    name: "${prefix} Temperature"
    address: 0x40D
    register_type: read
    reuse_previous_range: true
    value_type: U_WORD
    accuracy_decimals: 0
    # MUST be "°C", not "C". Home Assistant validates unit against
    # device_class and logs "is using native unit of measurement 'C' which is
    # not a valid unit for the device class ('temperature')", losing unit
    # conversion and long-term statistics for this entity.
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
  - platform: modbus_controller
    modbus_controller_id: solax
    name: "${prefix} Inverter Power"
    address: 0x40e
    register_type: read
    value_type: U_WORD
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: solax
    id: ${prefix}_power_dc1
    name: "${prefix} Power DC1"
    address: 0x414
    register_type: read
    reuse_previous_range: true
    value_type: U_WORD
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: solax
    id: ${prefix}_power_dc2
    name: "${prefix} Power DC2"
    address: 0x415
    register_type: read
    value_type: U_WORD
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
  - platform: combination
    type: sum
    name: "${prefix} Total DC Power"
    sources:
      - source: ${prefix}_power_dc1
      - source: ${prefix}_power_dc2
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: solax
    name: "${prefix} Production Total"
    # 32-bit: 0x423 = low word, 0x424 = high word. As U_WORD it wrapped at 6553.5 kWh.
    address: 0x423
    register_type: read
    reuse_previous_range: true
    value_type: U_DWORD_R
    accuracy_decimals: 1
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    filters:
      # Yield is only valid in Normal mode (cf. wills106 SLEEPMODE_LASTAWAKE). A stray 0
      # makes HA start a new meter cycle and count the lifetime total again as production.
      - lambda: |-
          if (x == 0 || id(${prefix}_run_mode).state != "Normal") return {};
          return x;
      - multiply: 0.1
  - platform: modbus_controller
    modbus_controller_id: solax
    name: "${prefix} Production Today"
    address: 0x425
    register_type: read
    value_type: U_DWORD_R
    accuracy_decimals: 1
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.1

  # ── Diagnostics
  - platform: wifi_signal
    name: "${prefix} WiFi Signal"
    update_interval: 120s
  - platform: uptime
    name: "${prefix} Uptime"
    update_interval: 120s
  - platform: debug
    free:
      name: "${prefix} Heap Free"
    fragmentation:
      name: "${prefix} Heap Fragmentation"

text_sensor:
  - platform: version
    name: "${prefix} ESPHome Version"
  - platform: wifi_info
    ssid:
      name: "${prefix} SSID"
    bssid:
      name: "${prefix} BSSID"
    ip_address:
      name: "${prefix} IP"
  - platform: debug
    reset_reason:
      name: "${prefix} Reset Reason"
  - platform: modbus_controller
    modbus_controller_id: solax
    id: ${prefix}_run_mode
    name: "${prefix} Run Mode"
    address: 0x40f
    register_type: read
    raw_encode: HEXBYTES
    lambda: |-
      switch (modbus::helpers::word_from_hex_str(x, 0)) {
        case 0: return std::string("Waiting");
        case 1: return std::string("Checking");
        case 2: return std::string("Normal");
        case 3: return std::string("Fault");
        case 4: return std::string("Permanent Fault");
        case 5: return std::string("Update");
        case 6: return std::string("Off-grid waiting");
        case 7: return std::string("Off-grid");
        case 8: return std::string("Self Testing");
        case 9: return std::string("Idle");
        case 10: return std::string("Standby");
        default: return std::string("Unknown");
      }
  - platform: modbus_controller
    modbus_controller_id: solax
    name: "${prefix} Fault"
    entity_category: diagnostic
    # Inverter_FaultMessage: 0x427 = low word, 0x428 = high word. Bit names
    # from the SolaX X1-BOOST Modbus-RTU protocol V1.0.
    address: 0x427
    register_type: read
    raw_encode: HEXBYTES
    response_size: 4
    lambda: |-
      static const char *const NAMES[32] = {
          "TzProtect", "MainsLost", "GridVolt", "GridFreq", "PLLLost", "BusVolt", "ExportHardLimit", "Inv_OCP",
          "Dci_OCP", "ResidualCurrent", "PvVolt", "Ac10Mins_Voltage", "Isolation", "TemperatureOver", nullptr, "Earth",
          "SpiComms", "SciComms", nullptr, "InputConfig", "Eeprom", "Relay", "SampleConsistence", "ResidualCurrent_Device",
          "GeneralHardLimit", nullptr, nullptr, nullptr, nullptr, "DCI_Device", "Other_Device", nullptr};
      uint32_t bits = (uint32_t) modbus::helpers::word_from_hex_str(x, 2) << 16 | modbus::helpers::word_from_hex_str(x, 0);
      if (bits == 0)
        return std::string("None");
      std::string out;
      for (uint8_t i = 0; i < 32; i++) {
        if (!(bits & (1UL << i)))
          continue;
        if (!out.empty())
          out += ", ";
        out += NAMES[i] != nullptr ? std::string(NAMES[i]) : "Bit" + std::to_string(i);
      }
      return out;
