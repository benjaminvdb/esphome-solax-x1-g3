# Copy the lines below into your own secrets.yaml (in ESPHome Device Builder:
# the "Secrets" button). Never share or commit the real file.
wifi_ssid: "Your Wi-Fi network name"
wifi_password: "Your Wi-Fi password"
# 8 characters or more; used only for the fallback network.
fallback_password: "choose-a-password"
# Device Builder makes one for you when you create a device. Or generate one at
# https://esphome.io/components/api/#configuration-variables (the "generate" box).
api_encryption_key: "paste-the-32-byte-base64-key-here"
